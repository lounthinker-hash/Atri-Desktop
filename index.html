<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>亚托莉 · My Dear Moments</title><link rel="stylesheet" href="style.css"></head>
<body><header><strong>ATRI <small>My Dear Moments</small></strong><nav aria-label="项目导航"><button data-tab="stage" class="active">亚托莉</button><button data-tab="archive">原文与原声</button><button data-tab="profile">角色档案</button></nav></header>
<main>
<section id="stage"><div class="stage-layout"><div class="scene" id="scene"><img id="backdrop" alt=""><img id="sprite" alt="亚托莉"><div class="caption"><b id="name">亚托莉</b><p id="line"></p><small id="source"></small></div></div>
<aside><h1>亚托莉</h1><div class="jp">アトリ</div><label>画面<select id="look"></select></label><label id="bgLabel">背景<select id="bg"><option value="garden">花园</option><option value="classroom">黄昏的教室</option><option value="sunset">暮色中的小镇</option></select></label><label>原声<select id="clips"></select></label><div class="actions"><button class="primary" id="play">播放原声</button><button id="next">下一句</button></div><label class="check"><input id="match" type="checkbox" checked> 随原声匹配已还原的演出</label><label class="check"><input id="autoplay" type="checkbox"> 连续播放</label><label>音量<input type="range" min="0" max="1" step=".05" value=".75" id="volume"></label><small id="playStatus" aria-live="polite"></small><p class="hint">桌面常驻：双击项目中的「启动桌面亚托莉.cmd」。</p></aside></div></section>
<section id="archive" hidden><div class="title"><h1>原文与原声</h1><p>按章节回查上下文，或试听亚托莉的原声。</p></div><div class="filters"><label>范围<select id="scope"><option value="own">亚托莉的发言</option><option value="mention">其他人和旁白直接提及她</option><option value="all">全部剧情与旁白</option><option value="extra">系统及未匹配台词的原声</option></select></label><label>章节<select id="chapter"></select></label><label>原文版本<select id="lang"><option value="zh">简体中文</option><option value="ja">日本語</option><option value="tw">繁體中文</option><option value="en">English</option></select></label><label>搜索<input id="query" type="search" placeholder="台词、说话人、语音编号"></label></div><div class="pager"><span id="count"></span><div><button id="prevPage">上一页</button><button id="nextPage">下一页</button></div></div><div id="results"></div></section>
<section id="profile" hidden><article id="bio"></article><article><h2>素材来源</h2><div id="sources"></div></article></section>
<section id="archive-setup" hidden>
  <article>
    <h1>打开本地原作资料库</h1>
    <p>请先导入与你拥有的素材配套的 <code>data/game.js</code> 和 <code>data/media.js</code>，再刷新此页。资料库会从本地加载对应的文字、图像和录音。</p>
    <p><a href="README.md">查看项目说明</a></p>
  </article>
</section>
</main><audio id="audio" preload="none"></audio>
<script src="data/game.js"></script><script src="data/media.js"></script>
<script>
  if (window.ATRI_GAME && window.ATRI_MEDIA) {
    const script = document.createElement('script');
    script.src = 'app.js';
    document.body.append(script);
  } else {
    document.querySelector('header nav').hidden = true;
    document.getElementById('stage').hidden = true;
    document.getElementById('archive-setup').hidden = false;
  }
</script>
</body></html>
